# Tests and starts the app on Linux and Windows on every push. A v* tag also builds the downloads and puts them on a release
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Only the AppImage gets started below on Linux, so it's always built. The Windows installer only on tags
      - name: Package
        run: npx electron-builder --publish never ${{ (runner.os != 'Linux' && !startsWith(github.ref, 'refs/tags/v')) && '--dir' || '' }}

      # Ubuntu blocks the sandbox Electron normally uses, like a user's machine would, so this catches the AppImage not starting there
      - name: Start the built app
        run: |
          if [ "$RUNNER_OS" = Windows ]; then app=release/win-unpacked/Stratas.exe; run=""; else app=release/Stratas.AppImage; run="xvfb-run -a"; export APPIMAGE_EXTRACT_AND_RUN=1; fi
          STRATAS_SMOKE="$PWD/smoke.json" timeout 120 $run "$app" || true
          cat smoke.json
          node -e 'process.exit(JSON.parse(require("fs").readFileSync("smoke.json","utf8")).ok ? 0 : 1)'

      # Windows releases get signed by SignPath once the SIGNPATH_API_TOKEN secret and SIGNPATH_ORGANIZATION_ID variable are set.
      # Until then they go out unsigned
      - if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: release/Stratas-Setup.exe
      - if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          connector-url: https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'stratas' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800 # Every release waits for you to approve it on SignPath
          output-artifact-directory: release/signed
      # The update check compares the installer's hash, so it has to match the signed file
      - if: steps.unsigned.outcome == 'success'
        run: |
          mv -f release/signed/Stratas-Setup.exe release/Stratas-Setup.exe
          rm -f release/Stratas-Setup.exe.blockmap
          node scripts/rehash-update.mjs release/latest.yml release/Stratas-Setup.exe

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          # latest*.yml and the blockmaps are what the app's update check reads
          path: |
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-latest"
          merge-multiple: true
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Where to get it on top, GitHub's list of changes under it
        run: |
          printf '%s\n' "Website: **[stratas.lol](https://stratas.lol)**, or [try it in your browser](https://stratas.lol/app/) without installing anything." "" \
            "Windows: \`Stratas-Setup.exe\`. Until it's signed, Windows shows a \"Windows protected your PC\" popup: click More info, then Run anyway." "" \
            "Linux: \`Stratas.AppImage\`. Already on 1.1.0 or newer? Click the update button in the app." > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Stratas ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes *.exe *.AppImage *.blockmap latest*.yml
